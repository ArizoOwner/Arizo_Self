      <text x="700" y="100" class="a" text-anchor="middle">سوکت گرم</text>
      <text x="700" y="118" class="b" text-anchor="middle">MTProto</text>
    </g><g>
      <circle cx="900" cy="52" r="26" fill="#0d1224" stroke="#818cf8" stroke-opacity=".5" stroke-width="1.5"/>
      <circle cx="900" cy="52" r="26" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#g2)"><animate attributeName="stroke-opacity" values=".05;1;.05" dur="5s" begin="4s" repeatCount="indefinite"/></circle>
