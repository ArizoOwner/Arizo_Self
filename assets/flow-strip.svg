      <circle cx="700" cy="52" r="26" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#g2)"><animate attributeName="stroke-opacity" values=".05;1;.05" dur="5s" begin="3s" repeatCount="indefinite"/></circle>
