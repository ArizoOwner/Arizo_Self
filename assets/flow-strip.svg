      <circle cx="500" cy="52" r="26" fill="#0d1224" stroke="#818cf8" stroke-opacity=".5" stroke-width="1.5"/>
      <circle cx="500" cy="52" r="26" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#g2)"><animate attributeName="stroke-opacity" values=".05;1;.05" dur="5s" begin="2s" repeatCount="indefinite"/></circle>
      <text x="500" y="60" font-size="22" text-anchor="middle">🔄</text>
      <text x="500" y="100" class="a" text-anchor="middle">رانر</text>
      <text x="500" y="118" class="b" text-anchor="middle">هر ۱۰ ثانیه</text>
    </g><g>
