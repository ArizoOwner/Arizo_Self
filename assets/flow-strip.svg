<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="100%" role="img" aria-label="Arizo Self flow">
<defs>
<linearGradient id="l2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a16"/><stop offset="1" stop-color="#120b24"/></linearGradient>
<filter id="g2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>text{font-family:'Segoe UI','Vazirmatn','Tahoma',system-ui,sans-serif}.a{font-size:14px;font-weight:700;fill:#f1f5f9}.b{font-size:11.5px;fill:#94a3b8}</style>
</defs>
<rect width="1000" height="130" rx="22" fill="url(#bg2)"/>
<rect x="1" y="1" width="998" height="128" rx="21" fill="none" stroke="#818cf8" stroke-opacity=".22"/>
<path d="M 100 52 L 900 52" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M 100 52 L 900 52" stroke="url(#l2)" stroke-width="3" stroke-dasharray="8 12" fill="none"><animate attributeName="stroke-dashoffset" values="0;20" dur="1s" repeatCount="indefinite"/></path>
  <circle r="6" fill="#38bdf8" filter="url(#g2)"><animateMotion dur="5s" repeatCount="indefinite" path="M 100 52 L 900 52"/></circle><g>
      <circle cx="100" cy="52" r="26" fill="#0d1224" stroke="#818cf8" stroke-opacity=".5" stroke-width="1.5"/>
