name: ⚡ Telegram Clock Engine

on:
  workflow_dispatch:
  repository_dispatch:
    types: [continue-runner]
  schedule:
    # Off-peak twice-hourly watchdog (skips restart if a healthy runner is already active)
    - cron: '17,47 * * * *'

jobs:
  check-runner:
    name: 🔍 Health Check
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: 🩺 Check if Clock Engine is already active
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          node -e '
          const fs = require("fs");
          const out = (val) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_run=${val}\n`);
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "Arizo-HealthCheck"
          };
          async function fetchJson(url) {
            for (let i = 0; i < 3; i++) {
              try {
                const res = await fetch(url, { headers, signal: AbortSignal.timeout(10000) });
                if (res.ok) return await res.json();
              } catch (_) {}
              await new Promise(r => setTimeout(r, 1500));
            }
            return null;
          }
          (async () => {
            const selfId = Number(process.env.SELF_RUN_ID);
            const data = await fetchJson(`https://api.github.com/repos/${process.env.REPO}/actions/workflows/telegram-clock.yml/runs?per_page=15`);
            if (!data || !Array.isArray(data.workflow_runs)) {
              console.log("⚠️ Could not query workflow runs; failing safe to should_run=true");
              out("true");
              return;
            }
            const now = Date.now();
            const maxHealthyMs = 315 * 60 * 1000;
            const candidates = data.workflow_runs.filter(r =>
              r.id !== selfId &&
              (r.status === "in_progress" || r.status === "queued") &&
              (now - Date.parse(r.run_started_at || r.created_at)) < maxHealthyMs
            );
            let healthyActive = false;
            for (const r of candidates) {
              if (r.event !== "schedule") {
                healthyActive = true;
                break;
              }
              const jobs = await fetchJson(`https://api.github.com/repos/${process.env.REPO}/actions/runs/${r.id}/jobs?per_page=10`);
              const engineJob = (jobs?.jobs || []).find(j => j.name.includes("Run Clock Engine"));
              if (engineJob && (engineJob.status === "in_progress" || engineJob.status === "queued")) {
                healthyActive = true;
                break;
              }
            }
            const shouldRun = !healthyActive;
            console.log(`Candidates=${candidates.length}, healthyActive=${healthyActive} -> should_run=${shouldRun}`);
            out(String(shouldRun));
          })().catch(err => {
            console.error(err);
            out("true");
          });
          '

  run-clock-engine:
    name: ⏱️ Run Clock Engine
    needs: check-runner
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check-runner.outputs.should_run == 'true') }}
    concurrency:
      group: telegram-clock-engine
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies (Fast Cached)
        run: npm install --no-audit --no-fund --omit=dev

      - name: 🚀 Run Clock Engine
        env:
          CLOUDFLARE_URL: ${{ secrets.CLOUDFLARE_URL }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          API_ID: ${{ secrets.API_ID || '2040' }}
          API_HASH: ${{ secrets.API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/github-runner.js
